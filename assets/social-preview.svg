<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Industrial Training Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="trace" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="1240" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1000" cy="320" r="250" fill="url(#glow)"/>

  <!-- wiring traces into the terminal block -->
  <g fill="none" stroke="url(#trace)" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M780 230 H880"/>
    <path d="M780 320 H880"/>
    <path d="M780 410 H880"/>
    <path d="M1120 260 H1180 L1210 230"/>
    <path d="M1120 380 H1180 L1210 410"/>
  </g>
  <g fill="#0d1117" stroke="url(#trace)" stroke-width="3">
    <circle cx="780" cy="230" r="7"/>
    <circle cx="780" cy="320" r="7"/>
    <circle cx="780" cy="410" r="7"/>
    <circle cx="1210" cy="230" r="7"/>
    <circle cx="1210" cy="410" r="7"/>
  </g>

  <!-- module with lightning mark -->
  <rect x="880" y="190" width="240" height="260" rx="28" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
  <g fill="#1e293b" stroke="#334155" stroke-width="2">
    <rect x="900" y="210" width="28" height="18" rx="4"/>
    <rect x="936" y="210" width="28" height="18" rx="4"/>
    <rect x="972" y="210" width="28" height="18" rx="4"/>
    <rect x="1008" y="210" width="28" height="18" rx="4"/>
    <rect x="1044" y="210" width="28" height="18" rx="4"/>
    <rect x="1080" y="210" width="28" height="18" rx="4"/>
  </g>
  <path d="M1012 252 L962 336 H998 L984 404 L1042 312 H1004 Z" fill="url(#bolt)" stroke="#fef3c7" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="1090" cy="420" r="7" fill="#22c55e"/>
  <circle cx="1066" cy="420" r="7" fill="#334155"/>

  <!-- text -->
  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
    <text x="80" y="250" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="1">Industrial</text>
    <text x="80" y="326" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="1">Training Lab</text>
    <rect x="82" y="350" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="400" font-size="26" fill="#cbd5e1">电工实训 MCP · Blender 工业建模 · Agent Skills</text>
    <text x="80" y="440" font-size="20" fill="#94a3b8">荧光灯接线 · 分段照明 · PLC / HMI · 非标设备建模</text>
    <text x="80" y="540" font-size="20" fill="#64748b">github.com/RS-at</text>
  </g>
</svg>
