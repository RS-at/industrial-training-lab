<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>荧光灯 · 接线与启辉交互动画 v3</title>
<style>
:root{color-scheme:dark;--edge:#243850;--blue:#5ecbff;--cyan:#a3edff;--lime:#8bf5ae}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07101e;font-family:'Segoe UI','Microsoft Yahei',sans-serif}
body{display:grid;place-items:center}
#shell{position:relative;width:min(100vw,calc(100vh * 1.67442));max-height:100vh;aspect-ratio:1440/860;box-shadow:0 30px 90px #0009;overflow:hidden;background:#091322}
#scene{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#scene .part{cursor:grab;touch-action:none;filter:drop-shadow(0px 5px 5px #0c162463)}
#scene .part:active{cursor:grabbing}
#scene .part.dragging{filter:drop-shadow(0 12px 13px #0107139e)}
#scene .target{cursor:pointer;transition:opacity .2s ease}
#scene .target:not(.filled):hover .target-frame{stroke:#55d8fa;stroke-width:2.5;stroke-dasharray:7 5;opacity:.88}
#scene .target.filled{pointer-events:none;opacity:0}
#scene .target-frame{stroke:#62bada;opacity:.49;stroke-dasharray:7 8;fill:#81daed08;stroke-width:1.6}
#scene .part.dragging~.target{opacity:.75}
#scene .mount-points circle{fill:#f9fbfb;stroke:#8999a7;stroke-width:2}
#scene .tray-mark{fill:#99b8d1;opacity:.28}
#scene .board-glow{pointer-events:none}
#scene .click-area{fill:transparent;pointer-events:all}
#controls{position:absolute;right:6.3%;top:3.35%;display:flex;gap:9px;align-items:center;z-index:5}
#controls button{position:relative;display:grid;place-items:center;width:45px;height:45px;padding:0;border:1px solid #6082a36b;border-radius:13px;color:#dceffb;background:#0c1b2cd9;box-shadow:0 7px 15px #050d1773;cursor:pointer;transition:transform .15s,background .15s,box-shadow .18s}
#controls button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#controls button:hover{background:#1b3b50;transform:translateY(-2px)}
#controls button:focus-visible{outline:2px solid #95e7ff;outline-offset:3px}
#controls button:active{transform:scale(.94)}
#controls button.live{color:#e4ffff;border-color:#9ad9ff;background:#124a67;box-shadow:0 0 18px #4edcff46,inset 0 0 10px #43d7ff1a}
#controls button.live:before{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#82ffa9;box-shadow:0 0 7px #82ffa9}
@media(max-width:850px){#controls{gap:5px;right:5.5%;top:3.7%}#controls button{width:35px;height:35px;border-radius:10px}#controls button svg{width:18px;height:18px}}
@media(prefers-reduced-motion:reduce){#controls button{transition:none}}

/* v3: immersive wiring and ignition effects */
#scene .wire-path{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#scene .wire-outline{stroke:#213243;stroke-width:10;opacity:.88}
#scene .wire-insulation{stroke-width:6.2;filter:drop-shadow(0 2px 1px #14232c80)}
#scene .wire-sheen{stroke:#fff;stroke-width:1.6;opacity:.30}
#scene .wire-current{stroke:#fff6ad;stroke-width:3.1;stroke-dasharray:22 110;stroke-dashoffset:0;opacity:0;animation:current-waves 1.5s linear infinite;filter:drop-shadow(0 0 4px #fff4a2)}
#scene .wire-current.flowing{opacity:.8}
#scene .wire-current.pe{display:none}
@keyframes current-waves{to{stroke-dashoffset:-132}}
#scene .connection-terminal{fill:#eecb8b;stroke:#345163;stroke-width:2.1;pointer-events:all;cursor:crosshair}
#scene .connection-ring{fill:none;stroke:#33d5ff;stroke-width:2.2;opacity:.5;pointer-events:none}
#scene .connection-ring.next{stroke:#fff2a0;opacity:1;animation:terminal-pulse 1.3s ease-in-out infinite}
#scene .connection-ring.selected{stroke:#8bf5ae;stroke-width:4;opacity:1}
@keyframes terminal-pulse{50%{opacity:.32;stroke-width:5}}
#scene .board-interface{cursor:pointer}
#scene .part.switch-ready{cursor:pointer}
#controls{right:4.5%;gap:7px}
#controls button{width:43px;height:43px}
#controls button.completed{border-color:#79dcad;color:#a5ffde}
#controls button.busy{border-color:#ffd47f;color:#ffe5a0}
#controls button.disabled{opacity:.58}
@media(max-width:850px){#controls{right:3.6%;gap:4px}#controls button{width:33px;height:33px}}

/* v3 controls: scenario modes, inspection, pause, speed and timeline */
#hud{position:absolute;left:4.3%;top:3.5%;z-index:6;display:flex;align-items:center;gap:8px;pointer-events:none}
#hud button{pointer-events:auto;display:grid;place-items:center;border:1px solid #6a9dc078;background:#0a2338df;color:#d8f8ff;width:39px;height:39px;border-radius:11px;box-shadow:0 5px 16px #06101b9c;cursor:pointer;font:700 15px 'Segoe UI',sans-serif}
#hud button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#hud button:hover,#hud button[aria-pressed=true]{background:#155170;color:white;border-color:#93defd}
#hud button[data-mode=aging]{color:#ffc77e;border-color:#e4ad6f99}
#hud button[data-mode=fault]{color:#ff9b91;border-color:#ef858599}
#hud #speed{font-size:13px;width:45px}
#timeline{position:absolute;z-index:6;left:25%;right:25%;bottom:1.25%;height:11px;border-radius:9px;border:1px solid #588fb470;background:#102236eb;cursor:pointer;display:none;overflow:visible;touch-action:none}
#timeline::before{content:'';position:absolute;inset:3px;border-radius:3px;background:linear-gradient(90deg,#f7a663 0 23%,#76c8f3 23% 49%,#f7a663 49% 75%,#a1f5de 75% 100%);opacity:.43;pointer-events:none}
#timelineProgress{position:absolute;height:3px;top:3px;left:3px;width:0;background:#dcfaff;box-shadow:0 0 9px #9befff;border-radius:3px;pointer-events:none}
#timelineThumb{position:absolute;top:-4px;left:0;transform:translateX(-50%);width:17px;height:17px;background:#ebffff;border:3px solid #539ed5;border-radius:50%;box-shadow:0 0 14px #8be4ffa3;pointer-events:none}
#timeline.visible{display:block}
#pulseRing{pointer-events:none;opacity:0}
#starterDetail{display:none;pointer-events:none}
#starterDetail.visible{display:block}
#starterDetail .glass-bulb{fill:#22385055;stroke:#cbecf5;stroke-width:3}
#starterDetail .contact-wire{fill:none;stroke:#d8d7cb;stroke-width:6;stroke-linecap:round}
#starterDetail .contact-head{fill:#e9e4d0;stroke:#8cabb5;stroke-width:2}
#starterDetail .close-spark{opacity:0}
#starterDetail .arc-field{opacity:0}
@media(max-width:850px){#hud{left:3.7%;gap:4px;top:3.8%}#hud button{width:31px;height:31px;border-radius:9px}#hud button svg{width:17px;height:17px}#hud #speed{font-size:11px;width:37px}#timeline{bottom:1%;height:8px}}
</style>
</head>
<body>
<div id="shell">

 <linearGradient id="ballastCase" x1="0" x2="1"><stop stop-color="#e1e6e6"/><stop offset=".2" stop-color="#f7fbf9"/><stop offset=".8" stop-color="#c7d3d8"/><stop offset="1" stop-color="#a8b6bf"/></linearGradient>

 <rect x="244" y="601" width="24" height="37" rx="5" fill="#77a46b" stroke="#476d4c" stroke-width="2"/>
 <g font-family="Arial" text-anchor="middle" font-weight="700" font-size="14" fill="#172a32"><text x="156" y="598">L</text><text x="206" y="598">N</text><text x="256" y="598">PE</text></g>

</g>

<rect x="85" y="737" width="1270" height="80" rx="12" fill="#1a2b41" opacity=".4"/>
<path d="M101 778 H1340" stroke="#a2cce5" stroke-opacity=".09" stroke-dasharray="7 15" stroke-width="1.5"/>

</g>

<script>
(()=>{'use strict';
const svg=document.querySelector('#scene'), layer=document.querySelector('#parts'), ambient=document.querySelector('#ambientLight');
const buttonAuto=document.querySelector('#auto'),buttonPower=document.querySelector('#power'),buttonReplay=document.querySelector('#replay'),buttonReset=document.querySelector('#reset');
const cfg={
 tube:   {target:[720,247],home:[480,775],scale:1,homeScale:.425},
 holderL:{target:[222,256],home:[741,774],scale:1,homeScale:.69},
 holderR:{target:[1220,256],home:[829,774],scale:1,homeScale:.69},
 ballast:{target:[418,505],home:[960,776],scale:1,homeScale:.52},
 starter:{target:[862,503],home:[1097,774],scale:1,homeScale:.59},
 switch: {target:[1118,507],home:[1214,774],scale:1,homeScale:.59}
};
// Cosmetic SVG renders. The training board is a placement simulation, not an electrical wiring plan.
const lamp=()=>`<g class="light-layers" pointer-events="none">
   <rect x="-505" y="-46" width="1010" height="94" rx="48" fill="#b7efff" filter="url(#soft-glow)" class="lamp-outer" opacity="0"/>
   <rect x="-495" y="-30" width="990" height="60" rx="30" fill="#e1ffff" filter="url(#medium-glow)" class="lamp-inner" opacity="0"/>
 </g>
 <g class="ignition-effects" pointer-events="none">
  <rect class="pulse-field" x="-473" y="-24" width="946" height="48" rx="24" fill="#b9d9ff" filter="url(#medium-glow)" opacity="0"/>
  <path class="plasma-path" d="M-440 0 C-350 -20,-260 18,-170 0 S 40 15,130 0 S 350 12,440 0" fill="none" stroke="#d2b6ff" stroke-width="6" filter="url(#medium-glow)" opacity="0"/>
  <rect class="wave-front" x="-450" y="-22" width="90" height="44" rx="22" fill="#f1faff" filter="url(#soft-glow)" opacity="0"/>
 </g>

 [6.6,0,.10,0,0,1,'preheat'],[7.3,0,1,0,0,1,'preheat'],[7.62,.12,.53,0,.92,0,'strike'],
 [7.78,0,.12,0,0,0,'glow'],[8.5,0,0,0,0,0,'off']
 ]}
};
function getState(t){
 const keyframes=choreography[ignitionMode].steps;
 if(t>=keyframes.at(-1)[0])return keyframes.at(-1).slice(1);
 let a=keyframes[0],b=keyframes.at(-1);
 for(let i=1;i<keyframes.length;i++)if(t<=keyframes[i][0]){b=keyframes[i];a=keyframes[i-1];break}
 const x=Math.max(0,Math.min(1,(t-a[0])/(b[0]-a[0])));
 return [1,2,3,4,5].map(k=>a[k]+(b[k]-a[k])*x).concat([a[6]]);
}
function renderIgnition(t){
 const duration=choreography[ignitionMode].duration;
 const [lum,fil,st,pulse,closed,phase]=getState(Math.min(duration,t));
 setGlow(lum,fil,st,pulse,closed,phase,t);setFlow(phase);
 const ratio=Math.max(0,Math.min(1,t/duration));
 timelineProgress.style.width=`calc(${ratio*100}% - 6px)`;
 timelineThumb.style.left=`${ratio*100}%`;
 timeline.setAttribute('aria-valuenow',String(Math.round(100*ratio)));
 // In demo mode the lamp stays lit on its own; a faulty lamp remains dark.
}
function advanceFrame(now,token){
 if(token!==igniteVersion)return;
 if(lastTick===0)lastTick=now;
 const dt=Math.min(100,now-lastTick);lastTick=now;
 if(!paused){sequenceClock+=dt/1000*playbackSpeed;
  const duration=choreography[ignitionMode].duration;
  if(sequenceClock>=duration)sequenceClock=duration;
  renderIgnition(sequenceClock);
 }
 igniteRaf=requestAnimationFrame(now=>advanceFrame(now,token));
}
function startIgnition(){
 if(!allPlaced()||!allWired())return;
 off();lit=true;const token=++igniteVersion;sequenceClock=0;lastTick=0;
 timeline.classList.add('visible');renderIgnition(0);
 igniteRaf=requestAnimationFrame(now=>advanceFrame(now,token));
}
async function runPower(){
 if(lit){off();return}
 // One click starts the whole staged demo even if the user has not used the other buttons.
 if(!allPlaced())await autoBuild();
 if(!allWired())await autoWire();
 if(allWired()&&allPlaced())startIgnition();
}
function reset(){buildVersion++;wireVersion++;off();buildBusy=false;wireBusy=false;buildPromise=null;wirePromise=null;
 wiresLayer.replaceChildren();wireObjects.length=0;connected=0;selectedTerminal=null;
 for(const id of order)unsnap(parts[id]);updateDots();renderTerminals();
}
function changeMode(){
 const at=modeOrder.indexOf(ignitionMode);ignitionMode=modeOrder[(at+1)%modeOrder.length];
 modeButton.dataset.mode=ignitionMode;
 modeButton.title='启动模式：'+modeNames[ignitionMode]+'（点击切换）';
 const icons={normal:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/>',
 aging:'<path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6M12 7v5l3 2"/>',
 fault:'<path d="M5 5L19 19M19 5L5 19"/><circle cx="12" cy="12" r="10"/>'};
 modeButton.innerHTML=`<svg viewBox="0 0 24 24">${icons[ignitionMode]}</svg>`;
 if(lit)startIgnition();
}
modeButton.addEventListener('click',changeMode);
inspectButton.addEventListener('click',()=>{detailOpen=!detailOpen;detailPanel.classList.toggle('visible',detailOpen);inspectButton.setAttribute('aria-pressed',String(detailOpen))});
pauseButton.addEventListener('click',()=>{
 if(!lit)return;
 paused=!paused;pauseButton.setAttribute('aria-pressed',String(paused));
 pauseButton.innerHTML=paused?'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>';
 lastTick=0;
});
speedButton.addEventListener('click',()=>{playbackSpeed=playbackSpeed===1?.5:playbackSpeed===.5?1.5:1;speedButton.textContent=playbackSpeed+'×'});
function seekTimeline(x){if(!lit)return;const r=timeline.getBoundingClientRect();sequenceClock=Math.min(1,Math.max(0,(x-r.left)/r.width))*choreography[ignitionMode].duration;lastTick=0;renderIgnition(sequenceClock)}
timeline.addEventListener('pointerdown',ev=>{timeline.setPointerCapture(ev.pointerId);seekTimeline(ev.clientX)});
timeline.addEventListener('pointermove',ev=>{if(timeline.hasPointerCapture(ev.pointerId))seekTimeline(ev.clientX)});
timeline.addEventListener('keydown',ev=>{if(!lit)return;if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();const delta=ev.key==='ArrowLeft'?-0.2:.2;sequenceClock=Math.max(0,Math.min(choreography[ignitionMode].duration,sequenceClock+delta));renderIgnition(sequenceClock)}});
buttonAuto.addEventListener('click',()=>{void autoBuild()});
buttonWire.addEventListener('click',()=>{void nextWire()});
buttonWireAll.addEventListener('click',()=>{void autoWire()});
buttonPower.addEventListener('click',()=>{void runPower()});
buttonReplay.addEventListener('click',async()=>{
 if(!allPlaced())await autoBuild();if(!allWired())await autoWire();if(allWired())startIgnition();
});
buttonReset.addEventListener('click',reset);
for(const t of document.querySelectorAll('.target')){
 t.addEventListener('click',()=>{const id=t.dataset.id,p=parts[id];if(p.placed||p.animating||buildBusy)return;
  off();clearWires();snap(p);
 });
}
layer.addEventListener('pointerdown',evt=>{
 const hit=evt.target.closest('.part');if(!hit||buildBusy||wireBusy)return;
 const p=parts[hit.dataset.id];if(p.animating)return;
 const xy=svgPoint(evt);
 drag={p,pid:evt.pointerId,ox:xy.x-p.x,oy:xy.y-p.y,downx:xy.x,downy:xy.y,travel:0};
 p.el.classList.add('dragging');svg.setPointerCapture(evt.pointerId);evt.preventDefault();
});
svg.addEventListener('pointermove',evt=>{
 if(!drag||drag.pid!==evt.pointerId)return;
 const xy=svgPoint(evt),p=drag.p;
 drag.travel=Math.max(drag.travel,Math.hypot(xy.x-drag.downx,xy.y-drag.downy));
 if(drag.travel<6)return;
 if(p.placed){off();clearWires();p.placed=false;targetMark(p.id,false)}
 p.x=Math.max(65,Math.min(1375,xy.x-drag.ox));p.y=Math.max(105,Math.min(795,xy.y-drag.oy));p.scale=cfg[p.id].scale;place(p);
});
function finishDrag(evt){
 if(!drag||drag.pid!==evt.pointerId)return;
 const {p,travel}=drag;p.el.classList.remove('dragging');drag=null;
 if(travel<8){
  if(!p.placed){off();clearWires();snap(p)}
  else if(p.id==='switch')void runPower();
  return;
 }
 const [tx,ty]=cfg[p.id].target;
 if(Math.hypot(p.x-tx,p.y-ty)<205){off();clearWires();snap(p)}else{off();clearWires();unsnap(p)}
}
svg.addEventListener('pointerup',finishDrag);
svg.addEventListener('pointercancel',finishDrag);
window.addEventListener('keydown',evt=>{
 if(evt.code==='Space'&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName)){evt.preventDefault();void runPower()}
 if(evt.code==='Escape')off();
 if(evt.key==='r'||evt.key==='R'){void runPower()}
 if(evt.key==='w'||evt.key==='W'){void nextWire()}
});
updateDots();renderTerminals();setGlow();
// Diagnostics for teachers / tests, not visible in the scene.
window.__fluorescentState=()=>({placed:allPlaced(),wires:connected,totalWires:WIRES.length,lit,mode:ignitionMode,paused,time:sequenceClock,speed:playbackSpeed,inspect:detailOpen});
})();

</script>
</body>
