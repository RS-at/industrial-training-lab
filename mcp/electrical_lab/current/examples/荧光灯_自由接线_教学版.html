function draw(){const r=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';for(const [a,b] of wires){const e1=document.querySelector(`[data-port="${a}"]`),e2=document.querySelector(`[data-port="${b}"]`);if(!e1||!e2)continue;const x=e1.getBoundingClientRect(),y=e2.getBoundingClientRect();const line=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [attr,val] of [['x1',x.left+x.width/2-r.left],['y1',x.top+x.height/2-r.top],['x2',y.left+y.width/2-r.left],['y2',y.top+y.height/2-r.top]])line.setAttribute(attr,val);svg.appendChild(line)}
 count.textContent=wires.length;wirelist.innerHTML=wires.length?'':'<span class="hint">当前还没有导线</span>';wires.forEach(([a,b],i)=>{const row=document.createElement('div');row.className='wire';const sp=document.createElement('span');sp.textContent=`${i+1}. ${a} ↔ ${b}`;const btn=document.createElement('button');btn.textContent='删除';btn.addEventListener('click',()=>{stop();wires.splice(i,1);ready=false;draw()});row.append(sp,btn);wirelist.append(row)})}
function judge(){const actual=new Set(wires.map(key));let best=null,min=1e9;for(const opt of variants){let d=0;for(const a of actual)if(!opt.has(a))d++;for(const b of opt)if(!actual.has(b))d++;if(d<min){min=d;best=opt}}if(min===0&&wires.length===6)return{ok:true,missing:[],extra:[]};return{ok:false,missing:[...best].filter(x=>!actual.has(x)),extra:[...actual].filter(x=>!best.has(x))}}
function check(){stop();const out=judge();ready=out.ok;if(out.ok)status.textContent='✔ 接线通过：6 根导线形成传统电感镇流器荧光灯标准教学回路。可以模拟通电。';else status.textContent='✕ 接线未通过。缺少 '+out.missing.length+' 根，错误/多余 '+out.extra.length+' 根。\n缺少：'+(out.missing.join('、')||'无')+'\n错误/多余：'+(out.extra.join('、')||'无');return out.ok}
function run(){stop();if(!check())return;switchedOn=true;const fault=document.querySelector('#fault').value;const lamp=document.querySelector('#lamp-v');function event(t,mode,msg){timers.push(setTimeout(()=>{if(!switchedOn)return;lamp.className='lamp-shell '+mode;status.textContent=msg},t))}
 if(['ballast_open','filament_a_open','filament_b_open'].includes(fault)){event(50,'','故障：预热回路不完整，灯管无法启动。');return}
 if(fault==='starter_open'){event(50,'','启辉器未闭合，灯丝无法按正常流程预热，灯管不亮。');return}
 event(50,'','① 启辉器辉光放电，双金属片受热');event(600,'preheat','② 触点闭合，灯管两端灯丝串联预热');
 if(fault==='starter_stuck_closed'){event(1650,'preheat','故障：启辉器一直闭合，灯丝持续预热，不能正常启辉。');return}
 event(1500,'','③ 启辉器触点断开，电感镇流器产生启辉脉冲');event(1650,'flash','④ 灯管开始闪烁尝试点亮');
 if(fault==='worn_lamp'){event(2050,'','未维持稳定放电，启辉器准备再次工作');event(2550,'preheat','故障演示：再次预热');event(3200,'flash','灯管老化，出现重复闪烁');event(3750,'','最终未能稳定点亮：请排查灯管老化问题');}
 else event(2040,'lit','⑤ 灯管稳定点亮，镇流器限制电流，启辉器保持断开。');}
document.querySelector('#demo').onclick=()=>{stop('已加载标准接线。请点击“检查接线”或“合闸/开始演示”。');wires=BASE.map(x=>x.slice());ready=false;draw()};
document.querySelector('#clear').onclick=()=>{stop('导线已清空。');wires=[];ready=false;draw()};document.querySelector('#off').onclick=()=>stop('电源已断开，灯管熄灭。');document.querySelector('#check').onclick=check;document.querySelector('#power').onclick=run;document.querySelector('#fault').onchange=()=>stop('故障类型已更改，请重新开始演示。');window.addEventListener('resize',draw);draw();
</script></body></html>
